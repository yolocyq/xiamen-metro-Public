/* ==================== 实际数据导入模块 ====================
 * 与 4/6 号线新线站的「实际数据导入」同构：
 *   导入站级实际客流 → 回测当前模型 → 累积学习 → 写入长期记忆
 * 本页差异：模型的站级锚点是
 *   CRAWLED.historicalData.station_calibration[站名+'站'].daily_normal
 * 学到的基准直接写回该处，全站预测（含运营总览、活动保障）立即生效。
 * 数据只在本机浏览器处理，不上传任何服务器。
 * ========================================================= */
var LEARNED_DOW = null;   // 学到的星期系数，computeBaseline() 已引用；无学习时为 null

var ImportMod = (function(){
  var KEY = 'xmMetroImport_v1';
  var state = blank();

  function blank(){
    return { version:2, stations:{}, alias:{}, globalDow:null, history:[], meta:{}, updatedAt:null };
  }
  function mean(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : 0; }
  function uniq(a){ var o={},r=[]; a.forEach(function(x){ if(!o[x]){o[x]=1;r.push(x);} }); return r; }

  /* ---- 存取 ---- */
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){
        var o = JSON.parse(raw);
        state = Object.assign(blank(), o || {});
        if(!state.stations) state.stations = {};
        if(!Array.isArray(state.history)) state.history = [];
      }
    }catch(e){ /* 隐私模式下降级为内存态 */ }
    applyToModel();
  }
  function save(){
    state.updatedAt = new Date().toISOString();
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }
  function calMap(){
    if(!CRAWLED.historicalData) CRAWLED.historicalData = {};
    if(!CRAWLED.historicalData.station_calibration) CRAWLED.historicalData.station_calibration = {};
    return CRAWLED.historicalData.station_calibration;
  }
  /* 模型当前给某站算出的「常态日合计」——作为量级校验的参照物。
   * 有校准条目的站用条目值；没有的站按 profile × 站规模 × 全局系数 还原，与预测口径一致。 */
  function modelAnchor(stn){
    var e = calMap()[stn + '站'] || {};
    if(e._origNormal !== undefined) return e._origNormal;
    if(e.daily_normal) return e.daily_normal;
    if(e.daily_summer_avg) return e.daily_summer_avg;
    if(e.daily_2024) return e.daily_2024;
    try{
      var stype = getStationType(stn);
      var profile = BASELINE_PROFILES[stype] || BASELINE_PROFILES['通勤'];
      var scale = getStationScale(stn);
      var sum = 0;
      for(var h=0;h<24;h++) sum += (profile[h] || 0) * scale * GLOBAL_BASELINE_SCALE;
      return sum;
    }catch(err){ return null; }
  }

  /* 学到的基准写回模型，使全站预测立即生效。
   * 只有「属本站线网」且通过量级校验的站才写回：
   * - ext     = 不在 1/2/3 号线 70 站名单里（BRT、4/6 号线等），只存档不改模型
   * - suspect = 名字对得上但日均与原锚点相差 45% 以上，多半是同名不同线网，默认不覆盖 */
  function applyToModel(){
    var sc = calMap();
    Object.keys(state.stations).forEach(function(name){
      var r = state.stations[name];
      if(!r || r.ext || r.suspect || !(r.daily > 0)) return;
      var k = name + '站';
      if(!sc[k]) sc[k] = {};
      if(sc[k]._origNormal === undefined){
        sc[k]._origHad = (sc[k].daily_normal !== undefined && sc[k].daily_normal !== null);
        sc[k]._origNormal = Math.round(modelAnchor(name));
      }
      sc[k].daily_normal = Math.round(r.daily);
      sc[k].learned = true;
      sc[k].learned_days = r.days;
      sc[k].learned_from = r.firstAt || null;
      sc[k].learned_to = r.lastAt || null;
    });
    if(state.globalDow) LEARNED_DOW = state.globalDow;
  }

  /* ---- 统计 ---- */
  function stationCount(){ return Object.keys(state.stations).length; }
  function linkedCount(){
    var n = 0;
    Object.keys(state.stations).forEach(function(k){
      var r = state.stations[k];
      if(r && !r.ext && allStations.indexOf(k) >= 0) n++;
    });
    return n;
  }
  function extCount(){ return stationCount() - linkedCount(); }
  function suspects(){
    return Object.keys(state.stations).filter(function(k){
      var r = state.stations[k];
      return r && r.suspect;
    });
  }
  function totalRecords(){
    var t = 0;
    Object.keys(state.stations).forEach(function(n){ t += Object.keys(state.stations[n].byDate||{}).length; });
    return t;
  }
  function isEmpty(){ return Object.keys(state.stations).length === 0; }
  function meta(){ return state.meta || {}; }
  function history(){ return state.history || []; }

  /* ---- 站名归一化：容忍「站」后缀、括号备注、空格、地铁/BRT 字样 ---- */
  var _normIdx = null;
  function normName(s){
    return String(s == null ? '' : s)
      .replace(/[\s　]/g, '')
      .replace(/[（(][^）)]*[）)]/g, '')      // 「滨海新城（西柯）」→「滨海新城」
      .replace(/地铁|轻轨|BRT|brt/g, '')
      .replace(/站$/, '');                    // 「镇海路站」→「镇海路」
  }
  function normIdx(){
    if(_normIdx) return _normIdx;
    _normIdx = {};
    for(var i=0;i<allStations.length;i++){ _normIdx[normName(allStations[i])] = allStations[i]; }
    return _normIdx;
  }

  /* ---- 站名匹配：匹配到本站线网站点则返回该站名，否则返回 null（属其他线网） ---- */
  function matchStation(name){
    if(!name) return null;
    var n = String(name).trim();
    if(state.alias && state.alias[n] && allStations.indexOf(state.alias[n]) >= 0) return state.alias[n];
    if(allStations.indexOf(n) >= 0) return n;
    var hit = normIdx()[normName(n)];
    return hit || null;
  }

  /* ---- 归属分类：哪些站能进线网模型，哪些只是独立存档 ---- */
  function classify(records){
    var map = {}, order = [];
    (records || []).forEach(function(r){
      var key = String(r.station == null ? '' : r.station).trim();
      if(!key) return;
      var o = map[key];
      if(!o){ o = map[key] = { name:key, n:0, sum:0, days:{}, stn:matchStation(key) }; order.push(key); }
      o.n++;
      o.sum += Number(r.inbound) || 0;
      o.days[r.date] = 1;
    });
    var all = order.map(function(k){
      var o = map[k];
      o.avg = Math.round(o.sum / Math.max(1, Object.keys(o.days).length));
      o.daysCount = Object.keys(o.days).length;
      return o;
    });
    return {
      all: all,
      linked: all.filter(function(o){ return !!o.stn; }),
      external: all.filter(function(o){ return !o.stn; })
    };
  }

  /* ---- 剥离当日系数，反算「常态日基准」 ---- */
  function dayFactor(stn, date){
    var dc = getDayCoef(date, stn).coef;
    var wc = getWeatherCoef(date).coef;
    var tb = computeTransportBoost(stn, date).boost;
    var hb = computeHotelBoost(stn, date).boost;
    var sb = computeSocialHeatBoost(stn, date).boost;
    var dp = String(date).split('-');
    var wd = new Date(+dp[0], +dp[1]-1, +dp[2]).getDay();
    var ld = (LEARNED_DOW && LEARNED_DOW[wd]) || 1;
    return dc * wc * tb * hb * sb * ld;
  }
  function eventSum(stn, date){
    try{
      var e = computeEventFlow(stn, date);
      return (e.hourly || []).reduce(function(a,b){ return a+b; }, 0);
    }catch(err){ return 0; }
  }
  function stripped(stn, date, v){
    var g = dayFactor(stn, date);
    if(!(g > 0.01)) return null;
    var base = (v - eventSum(stn, date)) / g;   // 先减掉活动增量，再除掉日历/天气/区位系数
    return base > 0 ? base : null;
  }

  /* ---- 误差指标 ---- */
  function mape(p){ var v=p.filter(function(x){return x.actual>0;}); if(!v.length) return null;
    return v.reduce(function(a,x){return a+Math.abs(x.pred-x.actual)/x.actual;},0)/v.length; }
  function mae(p){ if(!p.length) return null; return p.reduce(function(a,x){return a+Math.abs(x.pred-x.actual);},0)/p.length; }
  function rmse(p){ if(!p.length) return null; return Math.sqrt(p.reduce(function(a,x){return a+Math.pow(x.pred-x.actual,2);},0)/p.length); }
  function bias(p){ if(!p.length) return null;
    var num=p.reduce(function(a,x){return a+(x.pred-x.actual);},0), den=p.reduce(function(a,x){return a+x.actual;},0);
    return den ? num/den : null; }
  function r2(p){ if(p.length<2) return null;
    var as=p.map(function(x){return x.actual;}), m=mean(as);
    var ss=as.reduce(function(a,v){return a+Math.pow(v-m,2);},0); if(!ss) return null;
    return 1 - p.reduce(function(a,x){return a+Math.pow(x.actual-x.pred,2);},0)/ss; }

  /* ---- 回测 ---- */
  function backtest(records){
    var pairs=[], miss=[];
    records.forEach(function(r){
      var stn = matchStation(r.station);
      if(!stn){ miss.push(r.station); return; }
      var p;
      try{ p = predictStation(stn, r.date); }catch(e){ return; }
      pairs.push({ station:stn, date:r.date, pred:p.totalPred, actual:r.inbound });
    });
    return { pairs:pairs, unmatched:uniq(miss), n:pairs.length,
             mape:mape(pairs), mae:mae(pairs), rmse:rmse(pairs), bias:bias(pairs), r2:r2(pairs) };
  }

  /* ---- 星期系数（跨站、跨批次累积） ---- */
  function dowFromAll(){
    var acc={0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
    Object.keys(state.stations).forEach(function(stn){
      var r = state.stations[stn];
      if(r.ext || r.suspect) return;          // 其他线网/疑似同名站不参与地铁作息学习
      var ds = Object.keys(r.byDate||{});
      /* 门槛：单站至少两周样本。样本太少时，星期系数会把日间随机波动
       * 误当成星期规律，反而拉低精度，不如不学。 */
      if(ds.length < 14) return;
      var vals = ds.map(function(d){ return r.byDate[d]; });
      var m = mean(vals); if(!m) return;
      ds.forEach(function(d){
        var dp = d.split('-');
        acc[new Date(+dp[0], +dp[1]-1, +dp[2]).getDay()].push(r.byDate[d]/m);
      });
    });
    var out={}, any=false;
    for(var k in acc){
      if(acc[k].length >= 5){
        /* 向 1 收缩一半并限幅：模型本身已有工作日/周末/节假日系数，
         * 这里只做小幅修正，避免两套系数相互放大。 */
        var v = mean(acc[k]);
        v = 1 + (v - 1) * 0.5;
        out[k] = +Math.max(0.85, Math.min(1.15, v)).toFixed(3);
        any = true;
      }
    }
    return any ? out : null;
  }

  /* ---- 主流程 ----
   * 约定：
   *   records 里每个站要么能对上线网（linked，参与回测、可写回模型），
   *   要么对不上（external，仅存档，绝不改模型）。
   * opts.force = true 时，即使量级差异过大也照旧覆盖（用户已确认是同一线网）。 */
  function learn(records, fileName, opts){
    opts = opts || {};
    var force = !!opts.force;
    var before = backtest(records);
    var added = 0, touched = {}, extTouched = {}, suspect = [];
    records.forEach(function(r){
      var v = Number(r.inbound) || 0;
      if(v <= 0) return;
      var stn = matchStation(r.station);
      var key = stn || String(r.station == null ? '' : r.station).trim();
      if(!key) return;
      var rec = state.stations[key];
      if(!rec) rec = state.stations[key] = { byDate:{}, days:0, daily:0, rawMean:0, firstAt:null, lastAt:null };
      if(!stn) rec.ext = true;
      if(rec.byDate[r.date] === undefined) added++;
      rec.byDate[r.date] = v;                          // 同日期以最新值为准，天然去重
      if(stn) touched[stn] = true; else extTouched[key] = true;
    });

    var gdow = dowFromAll();
    if(gdow) state.globalDow = gdow;

    /* 线网站点：剥离当日系数后反算常态日基准 */
    Object.keys(touched).forEach(function(stn){
      var rec = state.stations[stn];
      var ds = Object.keys(rec.byDate).sort();
      rec.days = ds.length;
      rec.rawMean = mean(ds.map(function(d){ return rec.byDate[d]; }));
      var sb = [];
      ds.forEach(function(d){ var x = stripped(stn, d, rec.byDate[d]); if(x != null) sb.push(x); });
      rec.daily = Math.round(sb.length ? mean(sb) : rec.rawMean);
      rec.stripped = sb.length > 0;
      if(ds.length){ rec.firstAt = ds[0]; rec.lastAt = ds[ds.length-1]; }
      rec.ext = false;

      /* 量级校验：与模型当前锚点比，偏差超过 ±45% 视为「疑似同名不同线网」。
       * 典型场景：文件里的「文灶」是 BRT 文灶（约 6 千/日），地铁文灶是 2 万级。
       * 这类数据写进模型会把地铁站的基准打到地板价，所以默认拦下。 */
      var ref = modelAnchor(stn);
      if(!force && ref > 0 && (rec.daily / ref < 0.55 || rec.daily / ref > 1.8)){
        rec.suspect = true;
        rec.suspectRef = ref;
        suspect.push(stn);
      } else {
        rec.suspect = false;
        delete rec.suspectRef;
      }
    });

    /* 其他线网站点：只算实际日均，不做系数剥离（没有对应模型），纯存档 */
    Object.keys(extTouched).forEach(function(k){
      var rec = state.stations[k];
      var ds = Object.keys(rec.byDate).sort();
      rec.days = ds.length;
      rec.rawMean = mean(ds.map(function(d){ return rec.byDate[d]; }));
      rec.daily = Math.round(rec.rawMean);
      rec.stripped = false;
      rec.ext = true;
      if(ds.length){ rec.firstAt = ds[0]; rec.lastAt = ds[ds.length-1]; }
    });

    /* 只统计「真正写回模型的站」的复测结果：
     * 疑似同名站被拦下后仍留在样本里会把 MAPE 拖高，单看总数会误判学习无效。 */
    var learnedSet = {};
    Object.keys(touched).forEach(function(n){ if(suspect.indexOf(n) < 0) learnedSet[n] = 1; });
    var learnedRecs = records.filter(function(r){
      var s2 = matchStation(r.station);
      return s2 && learnedSet[s2];
    });
    var beforeLearned = learnedRecs.length ? backtest(learnedRecs) : { n:0 };

    applyToModel();
    save();
    var after = backtest(records);
    var afterLearned = learnedRecs.length ? backtest(learnedRecs) : { n:0 };

    var ds2 = records.map(function(r){ return r.date; }).sort();
    state.history.push({
      at:new Date().toISOString(), file:fileName || '手动导入',
      records:records.length, stationCount:Object.keys(touched).length, added:added,
      extCount:Object.keys(extTouched).length, suspectCount:suspect.length,
      dateFrom:ds2.length?ds2[0]:null, dateTo:ds2.length?ds2[ds2.length-1]:null,
      beforeMape:before.mape, afterMape:after.mape, n:after.n
    });
    if(state.history.length > 100) state.history = state.history.slice(-100);
    state.meta = {
      lastLearnAt:new Date().toISOString(), lastFile:fileName || null,
      learnCount:state.history.length, totalRecords:totalRecords(),
      totalStations:stationCount(),
      dateRange:(function(){
        var all=[];
        Object.keys(state.stations).forEach(function(n){ all = all.concat(Object.keys(state.stations[n].byDate||{})); });
        all.sort();
        return all.length ? all[0] + ' ~ ' + all[all.length-1] : '—';
      })()
    };
    save();
    return { before:before, after:after, beforeLearned:beforeLearned, afterLearned:afterLearned,
             added:added, stationCount:Object.keys(touched).length,
             extCount:Object.keys(extTouched).length, suspects:suspect,
             linkedNames:Object.keys(touched).filter(function(n){ return suspect.indexOf(n) < 0; }),
             extNames:Object.keys(extTouched), globalDow:gdow };
  }

  /* ---- 一键修复：把历史上被其他线网覆盖掉的站点基准还原 ---- */
  function revertSuspects(){
    var sc = calMap(), fixed = [];
    Object.keys(state.stations).forEach(function(name){
      var r = state.stations[name];
      if(!r) return;
      var e = sc[name + '站'];
      if(!e || e._origNormal === undefined) return;
      var now = e.daily_normal;
      if(now > 0 && (now / e._origNormal < 0.55 || now / e._origNormal > 1.8)){
        if(e._origHad === false) delete e.daily_normal;
        else e.daily_normal = e._origNormal;
        delete e._origNormal; delete e._origHad; delete e.learned; delete e.learned_days;
        delete e.learned_from; delete e.learned_to;
        r.ext = true; r.suspect = false; delete r.suspectRef;
        fixed.push(name);
      }
    });
    if(fixed.length){ save(); applyToModel(); }
    return fixed;
  }

  /* ---- 清空：还原模型到导入前 ---- */
  function clearAll(){
    var sc = calMap();
    Object.keys(state.stations).forEach(function(name){
      var k = name + '站', e = sc[k];
      if(!e) return;
      if(e._origNormal !== undefined){
        if(e._origHad === false) delete e.daily_normal;
        else e.daily_normal = e._origNormal;
        delete e._origNormal; delete e._origHad;
      }
      else delete e.daily_normal;
      delete e.learned; delete e.learned_days; delete e.learned_from; delete e.learned_to;
    });
    state = blank();
    LEARNED_DOW = null;
    try{ localStorage.removeItem(KEY); }catch(e){}
  }

  function exportJSON(){
    return JSON.stringify({ exportedAt:new Date().toISOString(), app:'xiamen-metro-main', schema:1, state:state }, null, 2);
  }
  function importJSON(txt){
    var o = JSON.parse(txt);
    var inc = (o && o.state) ? o.state : o;
    if(!inc || !inc.stations) return false;
    Object.keys(inc.stations).forEach(function(name){
      var src = inc.stations[name];
      var dst = state.stations[name];
      if(!dst) dst = state.stations[name] = { byDate:{}, days:0, daily:src.daily||0, rawMean:src.rawMean||0, firstAt:null, lastAt:null };
      var sb = src.byDate || {};
      Object.keys(sb).forEach(function(d){ dst.byDate[d] = sb[d]; });
      var ds = Object.keys(dst.byDate).sort();
      dst.days = ds.length || dst.days || 0;
      if(ds.length){ dst.firstAt = ds[0]; dst.lastAt = ds[ds.length-1]; dst.daily = Math.round(mean(ds.map(function(d){ return dst.byDate[d]; }))); }
    });
    if(inc.history && inc.history.length) state.history = state.history.concat(inc.history).slice(-100);
    var gdow = dowFromAll();
    if(gdow) state.globalDow = gdow;
    applyToModel();
    save();
    return true;
  }

  return {
    load:load, save:save, backtest:backtest, learn:learn,
    clearAll:clearAll, exportJSON:exportJSON, importJSON:importJSON,
    matchStation:matchStation, classify:classify, normName:normName, modelAnchor:modelAnchor,
    isEmpty:isEmpty, meta:meta, history:history,
    stationCount:stationCount, linkedCount:linkedCount, extCount:extCount,
    suspects:suspects, revertSuspects:revertSuspects,
    totalRecords:totalRecords,
    get raw(){ return state; }
  };
})();

/* ==================== 导入页 UI ==================== */
var IMP = { rows:null, headers:[], records:[], fields:{}, fileName:'', wide:false, lastBt:null };

function imNum(v){
  if(v == null || v === '') return null;
  var s = String(v).replace(/[,，\s]/g, '').replace(/人次|人|次|个/g, '');
  if(!s || !/^-?\d+(\.\d+)?$/.test(s)) return null;
  var n = Number(s);
  return isNaN(n) ? null : n;
}
function imPad(n){ n = String(n); return n.length < 2 ? '0' + n : n; }
function imNormDate(v){
  if(v instanceof Date && !isNaN(v.getTime())) return v.getFullYear()+'-'+imPad(v.getMonth()+1)+'-'+imPad(v.getDate());
  var s = String(v == null ? '' : v).trim();
  /* Excel 日期序列号（如 46281 → 2026-09-16）。表格里日期列若为数值格式，
     cellDates 未必生效，这里兜底转换。 */
  if(/^\d{5}(\.\d+)?$/.test(s)){
    var serial = Number(s);
    if(serial >= 20000 && serial <= 80000){
      var t = new Date(Date.UTC(1899, 11, 30) + Math.floor(serial) * 86400000);
      return t.getUTCFullYear() + '-' + imPad(t.getUTCMonth()+1) + '-' + imPad(t.getUTCDate());
    }
  }
  var m = s.match(/(\d{4})[-\/年](\d{1,2})[-\/月](\d{1,2})/);
  if(m) return m[1] + '-' + imPad(m[2]) + '-' + imPad(m[3]);
  var m2 = s.match(/^(\d{1,2})[-\/](\d{1,2})$/);
  if(m2) return new Date().getFullYear() + '-' + imPad(m2[1]) + '-' + imPad(m2[2]);
  var m3 = s.match(/^(\d{1,2})月(\d{1,2})日$/);
  if(m3) return new Date().getFullYear() + '-' + imPad(m3[1]) + '-' + imPad(m3[2]);
  return null;
}
function imPct(x){ return x == null ? '—' : (x*100).toFixed(2) + '%'; }
/* 普通整数千分位。注意不能复用 fmtNum——那个函数做了百位取整，
 * 传 2 会变成 0，曾导致「解析出 0 条记录」的误显示。 */
function imInt(n){
  if(n == null || isNaN(n)) return '—';
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
/* 在表格前若干行里找出真正的表头行，跳过「XX统计表」这类标题行 */
function imFindHeaderRow(rows){
  var best = 0, bestScore = -1;
  var lim = Math.min(8, rows.length);
  for(var i=0;i<lim;i++){
    var r = rows[i] || [], score = 0, hasS = false, hasD = false, hasV = false, dateCols = 0;
    for(var j=0;j<r.length;j++){
      var s = String(r[j] == null ? '' : r[j]).toLowerCase().replace(/\s/g,'');
      if(!s) continue;
      if(/站名|车站|站点|station/.test(s)) hasS = true;
      if(/日期|date|营业日/.test(s)) hasD = true;
      if(/进站|出站|客流|人次|刷卡|inbound|outbound/.test(s)) hasV = true;
      if(imIsDateHead(s)) dateCols++;
    }
    score = (hasS?3:0) + (hasD?2:0) + (hasV?2:0) + dateCols*2;
    if(score > bestScore){ bestScore = score; best = i; }
  }
  return { row: bestScore >= 3 ? best : 0, score: bestScore };
}

var IMP_FIELD_MATCH = {
  station:['站名','车站','站点','站点名称','车站名','station','站'],
  date:['日期','进站日期','统计日期','客流日期','date','时间日期'],
  hour:['小时','时段','时刻','hour','整点'],
  inbound:['进站','进站量','进站客流','进站人数','进站客','inbound','进站人次'],
  outbound:['出站','出站量','出站客流','出站人数','outbound','出站人次']
};
function imGuess(headers, kind){
  var keys = IMP_FIELD_MATCH[kind];
  for(var i=0;i<headers.length;i++){
    var hn = String(headers[i]).toLowerCase().replace(/\s/g,'');
    if(!hn) continue;
    for(var j=0;j<keys.length;j++){ if(hn.indexOf(keys[j]) >= 0) return i; }
  }
  return -1;
}
function imIsDateHead(h){ return /^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}$|^\d{1,2}[-\/]\d{1,2}$|^\d{1,2}月\d{1,2}日$/.test(h); }

/* 同站同日多条记录聚合求和，返回 {records, merged} */
function imAggregate(recs){
  var map = {}, out = [], merged = 0;
  for(var i=0;i<recs.length;i++){
    var r = recs[i], k = r.station + '|' + r.date;
    if(map[k]){ map[k].inbound += r.inbound; merged++; }
    else{
      var c = { station:r.station, date:r.date, inbound:r.inbound, outbound:r.outbound };
      map[k] = c; out.push(c);
    }
  }
  return { records: merged > 0 ? out : recs, merged: merged };
}

function imParseRows(rows, fname){
  var box = $_('impSummary');
  if(!rows || rows.length < 2){ imMsg('bad','文件为空或不足两行'); return; }
  /* 自动定位表头行：很多导出的第一行是「XX站客流统计表」这类大标题 */
  var hdr = imFindHeaderRow(rows);
  var skippedRows = hdr.row;
  if(skippedRows > 0) rows = rows.slice(skippedRows);
  var headers = rows[0].map(function(x){ return String(x == null ? '' : x).trim(); });
  var dateLike = headers.filter(function(h,i){ return i > 0 && imIsDateHead(h); });
  var wide = dateLike.length >= 3;
  var recs = [], fields = {};

  if(wide){
    var dIdx = [];
    headers.forEach(function(h,i){ if(i > 0 && imIsDateHead(h)) dIdx.push(i); });
    fields = { mode:'wide', station:0, dates:dIdx };
    for(var r=1;r<rows.length;r++){
      var row = rows[r] || [];
      var sname = String(row[0] == null ? '' : row[0]).trim();
      if(!sname) continue;
      dIdx.forEach(function(ci){
        var v = imNum(row[ci]);
        if(v == null || v <= 0) return;
        recs.push({ station:sname, date:imNormDate(headers[ci]), inbound:v, outbound:null });
      });
    }
  } else {
    var iS = imGuess(headers,'station'), iD = imGuess(headers,'date');
    var iH = imGuess(headers,'hour'), iI = imGuess(headers,'inbound'), iO = imGuess(headers,'outbound');
    if(iS < 0 || iD < 0){ imMsg('bad','未识别到「站名」或「日期」列。参考格式：站名 | 日期 | 进站量'); return; }
    if(iI < 0 && iO < 0){ imMsg('bad','未识别到「进站量」或「出站量」列。'); return; }
    if(iI < 0) iI = iO;
    fields = { mode:'long', station:iS, date:iD, hour:iH, inbound:iI, outbound:iO };
    for(var r2=1;r2<rows.length;r2++){
      var rw = rows[r2] || [];
      var sn = String(rw[iS] == null ? '' : rw[iS]).trim();
      if(!sn) continue;
      var d = imNormDate(rw[iD]);
      if(!d) continue;
      var iv = imNum(rw[iI]);
      if(iv == null) continue;
      recs.push({ station:sn, date:d, inbound:iv, outbound:iO >= 0 ? imNum(rw[iO]) : null });
    }
  }
  if(!recs.length){
    imMsg('bad','解析完成但没有得到有效数据行。请确认三点：① 表头含「站名 / 日期 / 进站量」；② 日期列能被识别（如 2026-09-16、2026/9/16、9月16日）；③ 客流列是数字。');
    return;
  }

  /* 同站同日多条记录（分时表、多张流水）自动按「站 + 日」求和聚合。
   * 不做这一步的话，同日期后写值会覆盖前值，最终只留下最后一个小时，
   * 学到的基准会低一到两个数量级。 */
  var _agg = imAggregate(recs);
  recs = _agg.records;
  var dupRows = _agg.merged;

  IMP.rows = rows; IMP.headers = headers; IMP.wide = wide;
  IMP.fields = fields; IMP.records = recs; IMP.fileName = fname || '手动导入';

  var names = [], dates = [];
  recs.forEach(function(r){ if(names.indexOf(r.station)<0) names.push(r.station); });
  recs.forEach(function(r){ if(dates.indexOf(r.date)<0) dates.push(r.date); });
  dates.sort();

  /* 归属分类：能进线网模型的 / 只能存档的 / 量级对不上的 */
  var cls = ImportMod.classify(recs);
  var susList = [];
  cls.linked.forEach(function(o){
    var ref = ImportMod.modelAnchor(o.stn);
    if(ref > 0 && (o.avg / ref < 0.55 || o.avg / ref > 1.8)){ o.ratio = o.avg / ref; o.ref = ref; susList.push(o); }
  });
  IMP.cls = cls;
  IMP.suspectNames = susList.map(function(o){ return o.stn; });

  var colDesc = wide
    ? ('宽表：首列为站名，另有 ' + fields.dates.length + ' 个日期列')
    : ('站名 = <b>' + esc(headers[fields.station]) + '</b>　日期 = <b>' + esc(headers[fields.date])
       + '</b>　客流 = <b>' + esc(headers[fields.inbound]) + '</b>'
       + (fields.hour >= 0 ? '　（含小时列，已聚合）' : ''));

  var h = '<div style="background:#e8f5e9;border-left:4px solid #2e7d32;padding:10px 14px;border-radius:6px;margin-top:12px">✓ 已从 <b>' + esc(IMP.fileName) + '</b> 解析出 <b>' + imInt(recs.length) + '</b> 条「站×日」记录 · '
    + names.length + ' 个站 · ' + dates.length + ' 天（' + dates[0] + ' ~ ' + dates[dates.length-1] + '）</div>'
    + '<div style="font-size:12px;color:#5a6b7d;margin-top:6px">识别到的列：' + colDesc
    + (skippedRows > 0 ? '　·　已跳过前 ' + skippedRows + ' 行标题' : '') + '</div>';
  if(dupRows > 0){
    h += '<div style="background:#e3f2fd;border-left:4px solid #1565c0;padding:10px 14px;border-radius:6px;margin-top:8px">'
      + '检测到 <b>' + imInt(dupRows) + '</b> 条同站同日记录（分时表或流水明细），已按「站 + 日」<b>求和聚合</b>为 ' + imInt(recs.length) + ' 条日记录。</div>';
  }

  /* 三分法说明：把「未匹配」这件事讲清楚，而不是丢一句报错 */
  if(cls.external.length || susList.length){
    h += '<div style="background:#fff8e1;border-left:4px solid #f57f17;padding:12px 14px;border-radius:6px;margin-top:8px;line-height:1.9">'
      + '<b>这批数据分三类，逐条说清楚：</b><br>'
      + '① <b>' + cls.linked.length + ' 个站</b>属本站线网（1/2/3 号线 70 站）→ 参与回测，学习后写回预测模型<br>'
      + '② <b>' + cls.external.length + ' 个站</b>不在这 70 个站名单里 → <b>照样存档、可看统计，但不会改动地铁线网模型</b><br>'
      + '③ <b>' + susList.length + ' 个站</b>名字对得上但日均差太多 → 疑似同名不同线网，<b>默认不覆盖</b>'
      + '</div>';

    h += '<div style="background:#e3f2fd;border-left:4px solid #1565c0;padding:12px 14px;border-radius:6px;margin-top:8px;line-height:1.85">'
      + '<b>② 是什么情况？</b>本站模型只覆盖地铁 1/2/3 号线的 70 个站。'
      + '名单外的基本来自<b>BRT 快速公交</b>和<b>4、6 号线</b>——比如「第一码头、开禾路口、思北、斗西路、二市、金榜公园、火车站、龙山桥」这一串就是 BRT 快 1 线的站序。'
      + '所以不是名字写错了，是两份名单本来就不同。这些数据会作为独立档案保存（可查每日均值与样本天数），只是不参与地铁基准校准。</div>';

    if(susList.length){
      h += '<div style="background:#ffebee;border-left:4px solid #c62828;padding:12px 14px;border-radius:6px;margin-top:8px;line-height:1.85">'
        + '<b>③ 需要你确认的 ' + susList.length + ' 个站：</b>'
        + susList.slice(0,6).map(function(o){
            return esc(o.stn) + '（文件日均 ' + imInt(o.avg) + '，本站模型 ' + imInt(o.ref) + '，仅 ' + Math.round(o.ratio*100) + '%）';
          }).join('；')
        + (susList.length > 6 ? ' 等' : '')
        + '。<br>典型原因：同名但属于不同线网（如 BRT 文灶约 6 千/日、地铁文灶是 2 万级）。'
        + '默认<b>不写入模型</b>；若确认是同一站同口径，可在下方勾选「强制覆盖」。</div>';
    }

    var listAll = function(arr, color){
      return '<details style="margin-top:8px"><summary style="cursor:pointer;font-size:13px;color:' + color + '">查看 ' + arr.length + ' 个站名清单</summary>'
        + '<div style="font-size:12px;color:#5a6b7d;line-height:1.9;margin-top:6px">'
        + arr.map(function(o){ return esc(o.name) + '（' + imInt(o.n) + ' 条/' + o.daysCount + ' 天，日均 ' + imInt(o.avg) + '）'; }).join('　·　')
        + '</div></details>';
    };
    if(cls.linked.length) h += listAll(cls.linked, '#2e7d32');
    if(cls.external.length) h += listAll(cls.external, '#e65100');
  }
  if(box) box.innerHTML = h;

  imRenderFields();
  imRenderPreview();
  var b1 = $_('impBt'), b2 = $_('impApply');
  if(b1) b1.disabled = false;
  if(b2) b2.disabled = false;
}

/* 按当前字段映射重新抽取（下拉框改选后调用） */
function imReExtract(){
  var rows = IMP.rows;
  if(!rows) return;
  var recs = [], f = IMP.fields;
  if(f.mode === 'wide'){
    for(var i=1;i<rows.length;i++){
      var row = rows[i] || [];
      var sn = String(row[0] == null ? '' : row[0]).trim();
      if(!sn) continue;
      f.dates.forEach(function(ci){
        var v = imNum(row[ci]);
        if(v == null || v <= 0) return;
        recs.push({ station:sn, date:imNormDate(IMP.headers[ci]), inbound:v, outbound:null });
      });
    }
  } else {
    for(var r=1;r<rows.length;r++){
      var rw = rows[r] || [];
      var s2 = String(rw[f.station] == null ? '' : rw[f.station]).trim();
      if(!s2) continue;
      var d = imNormDate(rw[f.date]);
      if(!d) continue;
      var iv = imNum(rw[f.inbound]);
      if(iv == null && f.outbound >= 0) iv = imNum(rw[f.outbound]);
      if(iv == null) continue;
      recs.push({ station:s2, date:d, inbound:iv, outbound:f.outbound >= 0 ? imNum(rw[f.outbound]) : null });
    }
  }
  var ag = imAggregate(recs);
  IMP.records = ag.records;
  imRenderPreview();
  imMsg('ok','已按新的字段映射重新抽取 <b>' + imInt(ag.records.length) + '</b> 条「站×日」记录'
    + (ag.merged > 0 ? '（' + imInt(ag.merged) + ' 条分时/重复记录已求和聚合）' : '')
    + '，点击「② 学习并复测」生效。');
}

function imRenderFields(){
  var box = $_('impFields');
  if(!box) return;
  if(IMP.wide){
    box.innerHTML = '<div style="background:#e3f2fd;border-left:4px solid #1565c0;padding:10px 14px;border-radius:6px">宽表格式：第一列为站名，后续 '
      + IMP.fields.dates.length + ' 列为日期（' + esc(IMP.headers[IMP.fields.dates[0]]) + ' ~ ' + esc(IMP.headers[IMP.fields.dates[IMP.fields.dates.length-1]]) + '）</div>';
    return;
  }
  var items = [
    {k:'station', lb:'站名列'},
    {k:'date', lb:'日期列'},
    {k:'hour', lb:'小时列（可选）'},
    {k:'inbound', lb:'进站量列'},
    {k:'outbound', lb:'出站量列（可选）'}
  ];
  box.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:12px">' + items.map(function(it){
    var cur = IMP.fields[it.k];
    var opts = '<option value="-1">— 未使用 —</option>' + IMP.headers.map(function(h2, idx){
      return '<option value="' + idx + '"' + (idx === cur ? ' selected' : '') + '>' + esc(h2) + '</option>';
    }).join('');
    return '<div><div style="font-size:12px;color:#666;margin-bottom:4px">' + it.lb + '</div>'
      + '<select data-fk="' + it.k + '" style="padding:6px 10px;border:1px solid #c8d6e5;border-radius:6px;font-size:12px">' + opts + '</select></div>';
  }).join('') + '</div>';
  var sels = box.querySelectorAll('select');
  for(var i=0;i<sels.length;i++){
    sels[i].onchange = function(){
      IMP.fields[this.getAttribute('data-fk')] = parseInt(this.value, 10);
      imReExtract();
    };
  }
}

function imRenderPreview(){
  var box = $_('impPreview');
  if(!box) return;
  if(!IMP.records.length){ box.innerHTML = ''; return; }
  var top = IMP.records.slice(0, 8);
  var h = '<table><thead><tr><th>站名</th><th>日期</th><th style="text-align:right">进站量</th><th>归属</th></tr></thead><tbody>';
  var susSet = {};
  (IMP.suspectNames || []).forEach(function(n){ susSet[n] = 1; });
  top.forEach(function(r){
    var stn = ImportMod.matchStation(r.station);
    var tag;
    if(!stn) tag = '<span class="badge" style="background:#eceff1;color:#546e7a">仅存档</span>';
    else if(susSet[stn]) tag = '<span class="badge" style="background:#fff3e0;color:#e65100">疑似同名 · 待确认</span>';
    else tag = '<span class="badge green">线网内 · ' + esc(stn) + '</span>';
    h += '<tr><td>' + esc(r.station) + '</td><td>' + esc(r.date) + '</td><td style="text-align:right">' + imInt(r.inbound) + '</td>'
      + '<td>' + tag + '</td></tr>';
  });
  h += '</tbody></table><div style="font-size:12px;color:#999;margin-top:6px">仅显示前 8 条</div>';
  box.innerHTML = h;
}

function imReport(title, bt){
  if(!bt || !bt.n) return '<div style="background:#fff3e0;border-left:4px solid #e65100;padding:10px 14px;border-radius:6px;margin-top:10px">' + title + '：没有可参与回测的记录（可能站名全部未匹配）。</div>';
  var m = bt.mape;
  var bg = m == null ? '#f5f5f5' : (m < 0.10 ? '#e8f5e9' : (m < 0.20 ? '#fff8e1' : '#ffebee'));
  var bd = m == null ? '#999' : (m < 0.10 ? '#2e7d32' : (m < 0.20 ? '#f57f17' : '#c62828'));
  var h = '<div style="background:' + bg + ';border-left:4px solid ' + bd + ';padding:10px 14px;border-radius:6px;margin-top:10px"><b>' + title + '</b>'
    + '　样本 ' + imInt(bt.n) + ' 条　|　MAPE <b>' + imPct(m) + '</b>　|　MAE ' + imInt(bt.mae)
    + '　|　RMSE ' + imInt(bt.rmse) + '　|　平均偏差 ' + (bt.bias == null ? '—' : (bt.bias > 0 ? '+' : '') + imPct(bt.bias))
    + '　|　R² ' + (bt.r2 == null ? '—' : bt.r2.toFixed(3)) + '</div>';
  if(bt.unmatched && bt.unmatched.length){
    h += '<div style="background:#e3eefd;border-left:4px solid #1565c0;padding:10px 14px;border-radius:6px;margin-top:8px;font-size:13px">'
      + '另有 <b>' + bt.unmatched.length + ' 个站</b>不属本站线网（BRT / 4、6 号线等），已单独存档，<b>不计入本次回测</b>。'
      + '回测只统计能对上线网模型的站点。</div>';
  }
  return h;
}

function imDoBacktest(){
  var box = $_('impBtResult'), btn = $_('impBt');
  try{
    if(!IMP.records.length){ imMsg('bad','还没有可回测的数据，请先选择文件或点「载入示例数据」。'); return; }
    if(btn){ btn.disabled = true; btn.textContent = '回测中…'; }
    var bt = ImportMod.backtest(IMP.records);
    IMP.lastBt = bt;
    if(box){
      box.innerHTML = imReport('学习前（当前模型）', bt);
      if(box.scrollIntoView) box.scrollIntoView({ behavior:'smooth', block:'center' });
    }
  }catch(e){
    if(box) box.innerHTML = '<div style="background:#ffebee;border-left:4px solid #c62828;padding:10px 14px;border-radius:6px;margin-top:10px">回测出错：' + esc(e.message) + '</div>';
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '① 回测当前模型'; }
  }
}

function imDoLearn(){
  if(!IMP.records.length){ imMsg('bad','还没有可学习的数据，请先选择文件或点「载入示例数据」。'); return; }
  var btn = $_('impApply');
  var fc = $_('impForce');
  var res;
  try{
    if(btn){ btn.disabled = true; btn.textContent = '学习中…'; }
    res = ImportMod.learn(IMP.records, IMP.fileName, { force: !!(fc && fc.checked) });
  }catch(e){
    var eb = $_('impBtResult');
    if(eb) eb.innerHTML = '<div style="background:#ffebee;border-left:4px solid #c62828;padding:10px 14px;border-radius:6px;margin-top:10px">学习出错：' + esc(e.message) + '。请把这份文件发给管理员排查。</div>';
    if(btn){ btn.disabled = false; btn.textContent = '② 学习并复测'; }
    return;
  }
  if(btn){ btn.disabled = false; btn.textContent = '② 学习并复测'; }

  var h = '';
  var wrote = res.stationCount - (res.suspects ? res.suspects.length : 0);

  if(res.after && res.after.n > 0){
    var onlyLearned = res.afterLearned && res.afterLearned.n > 0;
    h += imReport('学习前（上一次的记忆）' + (onlyLearned ? '：全部线网站点' : ''), res.before);
    if(onlyLearned){
      h += imReport('学习后（只看本次已校准的站点，' + (res.linkedNames || []).length + ' 个站）', res.afterLearned);
      h += imReport('学习后（全部线网站点，含被拦下的同名站）', res.after);
    } else {
      h += imReport('学习后（并入本次数据）', res.after);
    }
    var b0 = onlyLearned ? res.beforeLearned.mape : res.before.mape;
    var a0 = onlyLearned ? res.afterLearned.mape : res.after.mape;
    if(b0 != null && a0 != null){
      var delta = a0 - b0;
      var scope = onlyLearned ? '已校准的 ' + (res.linkedNames || []).length + ' 个站' : '本次样本';
      if(delta < -0.002){
        h += '<div style="background:#e8f5e9;border-left:4px solid #2e7d32;padding:10px 14px;border-radius:6px;margin-top:10px"><b>学习有效：</b>' + scope + '的 MAPE 由 '
          + imPct(b0) + ' 降到 ' + imPct(a0) + '，改善 ' + imPct(Math.abs(delta)) + '。</div>';
      } else if(delta > 0.002){
        h += '<div style="background:#fff3e0;border-left:4px solid #e65100;padding:10px 14px;border-radius:6px;margin-top:10px"><b>学习后误差反而变大：</b>' + scope + '的 MAPE 由 '
          + imPct(b0) + ' 升到 ' + imPct(a0) + '。常见原因：这批数据的时段与既有规律差异过大（如跨节假日），或含异常值。建议核对数据质量。</div>';
      } else {
        h += '<div style="background:#e3f2fd;border-left:4px solid #1565c0;padding:10px 14px;border-radius:6px;margin-top:10px">' + scope + '的 MAPE 基本持平（'
          + imPct(b0) + ' → ' + imPct(a0) + '），说明这批数据与已学到的规律一致。</div>';
      }
    }
  } else {
    /* 全部是其他线网的站：不再假装「回测失败」，直接把结论说清楚 */
    h += '<div style="background:#e3f2fd;border-left:4px solid #1565c0;padding:12px 14px;border-radius:6px;margin-top:10px;line-height:1.85">'
      + '<b>本次没有可回测的线网站点。</b>这批数据里的站全部不在 1/2/3 号线 70 站名单内（多为 BRT、4/6 号线），'
      + '所以没有「预测值」可以对比，MAPE 无从计算——这是正常的，不是导入失败。数据已作为独立档案保存。</div>';
  }

  var lines = [];
  lines.push('· <b>线网站点</b> → ' + res.stationCount + ' 个站' + (wrote > 0 ? '，其中 <b>' + wrote + ' 个已写回模型</b>：' + (res.linkedNames || []).map(esc).join('、') + '（全站预测立即生效）' : ''));
  if(res.extCount > 0){
    lines.push('· <b>其他线网站点</b> → ' + res.extCount + ' 个站已存档（可查日均与样本天数，不参与地铁模型）');
  }
  if(res.suspects && res.suspects.length){
    lines.push('· <b>疑似同名站点</b> → ' + res.suspects.length + ' 个站已跳过，未覆盖模型：' + res.suspects.map(esc).join('、'));
  }
  lines.push('· 新增 ' + imInt(res.added) + ' 条日记录（同日期以最新值为准）');
  if(res.globalDow){
    var nm = ['周日','周一','周二','周三','周四','周五','周六'];
    lines.push('· <b>星期系数</b> → ' + Object.keys(res.globalDow).map(function(k){ return nm[k] + ' ' + res.globalDow[k]; }).join('　'));
  }
  h += '<div style="background:#e3f2fd;border-left:4px solid #1565c0;padding:12px 14px;border-radius:6px;margin-top:12px;line-height:1.9"><b>本次写入长期记忆：</b><br>'
    + lines.join('<br>') + '</div>';

  if(res.suspects && res.suspects.length){
    h += '<div style="background:#ffebee;border-left:4px solid #c62828;padding:12px 14px;border-radius:6px;margin-top:10px;line-height:1.85">'
      + '<b>为什么这几站不写入？</b>它们的日均与本站模型原有锚点相差超过 45%，最可能的原因是<b>同名但属于不同线网</b>（例如 BRT 文灶约 6 千/日、地铁文灶是 2 万级）。'
      + '如果强行写入，地铁站的基准会被打到地板价，全线预测跟着失真。<br>'
      + '确认是同一站、同一口径（比如确实拿到了地铁文灶的实测），勾选上方的「强制覆盖同名站」再点一次学习即可。</div>';
  }

  h += '<div style="background:' + (wrote > 0 ? '#e8f5e9' : '#fff8e1') + ';border-left:4px solid ' + (wrote > 0 ? '#2e7d32' : '#f57f17') + ';padding:10px 14px;border-radius:6px;margin-top:10px">'
    + (wrote > 0
        ? '✓ <b>已同步到全站：</b>切到「运营总览」或「客流预测」标签页，即可看到按实测基准重算的结果。'
        : '本次没有站点写入线网模型，地铁 1/2/3 号线的预测结果保持不变。')
    + '<br>档案存放在本机浏览器，关闭浏览器、重启电脑后依然生效；换设备用「导出学习档案」迁移。</div>';

  var box = $_('impBtResult');
  if(box){
    box.innerHTML = h;
    if(box.scrollIntoView) box.scrollIntoView({ behavior:'smooth', block:'center' });
  }
  imRenderState();
  imRenderNeed();
}

function imRenderState(){
  var box = $_('impState');
  if(!box) return;
  if(ImportMod.isEmpty()){
    box.innerHTML = '<div style="background:#fff3e0;border-left:4px solid #e65100;padding:10px 14px;border-radius:6px"><b>学习档案为空。</b>'
      + '当前站点基准为公开数据推算值；导入站级实际客流后，模型会自动改用实测锚点，预测区间由 ±22% 收窄到 ±12%。档案存放在本机浏览器，关掉不会丢。</div>';
    return;
  }
  var hist = ImportMod.history(), m = ImportMod.meta();
  var lk = ImportMod.linkedCount(), ex = ImportMod.extCount();
  var h = '<div class="stats-grid">';
  h += '<div class="stat-card info"><div><div class="stat-value">' + imInt(hist.length) + '</div><div class="stat-label">累计学习次数</div></div></div>';
  h += '<div class="stat-card success"><div><div class="stat-value">' + imInt(ImportMod.totalRecords()) + '</div><div class="stat-label">累计日记录（同日期去重）</div></div></div>';
  h += '<div class="stat-card"><div><div class="stat-value">' + imInt(lk) + '</div><div class="stat-label">线网站点 / 共 ' + allStations.length + ' 站</div></div></div>';
  h += '<div class="stat-card' + (ex > 0 ? ' info' : '') + '"><div><div class="stat-value">' + imInt(ex) + '</div><div class="stat-label">仅存档站点（BRT / 其他线网）</div></div></div>';
  h += '<div class="stat-card"><div><div class="stat-value" style="font-size:16px">' + esc(m.dateRange || '—') + '</div><div class="stat-label">数据跨度</div></div></div>';
  h += '</div>';

  if(hist.length){
    var last = hist[hist.length-1];
    var ok = last.beforeMape != null && last.afterMape != null && last.afterMape < last.beforeMape;
    var tail = (last.extCount ? '，另存档 ' + imInt(last.extCount) + ' 个线网站点' : '')
             + (last.suspectCount ? '，跳过 ' + imInt(last.suspectCount) + ' 个疑似同名站' : '');
    h += '<div style="background:' + (ok ? '#e8f5e9' : '#e3f2fd') + ';border-left:4px solid ' + (ok ? '#2e7d32' : '#1565c0') + ';padding:10px 14px;border-radius:6px;margin-top:10px">'
      + '<b>最近一次学习</b>（' + esc((last.at || '').slice(0,16).replace('T',' ')) + '，' + esc(last.file) + '）：'
      + 'MAPE ' + imPct(last.beforeMape) + ' → <b>' + imPct(last.afterMape) + '</b>，样本 ' + imInt(last.n) + ' 条，新增 ' + imInt(last.added) + ' 条日记录' + tail + '。</div>';
  }
  if(ImportMod.raw.globalDow){

    h += '<div style="background:#e3f2fd;border-left:4px solid #1565c0;padding:10px 14px;border-radius:6px;margin-top:10px"><b>已学到的星期系数：</b>'
      + Object.keys(ImportMod.raw.globalDow).map(function(k){ return nm2[k] + ' <b>' + ImportMod.raw.globalDow[k] + '</b>'; }).join('　') + '</div>';
  }

  /* 健康检查：两类失真都能一键还原
   * ① 旧版未聚合分时数据 → 基准只有原锚点的零头
   * ② 同名不同线网（如 BRT 文灶）→ 基准被覆盖成另一个数量级 */
  var stt0 = ImportMod.raw.stations;
  var bad = [];
  Object.keys(stt0).forEach(function(k){
    var c = (CRAWLED.historicalData.station_calibration || {})[k + '站'] || {};
    if(!(c._origNormal > 0) || !(c.daily_normal > 0)) return;
    var rt = c.daily_normal / c._origNormal;
    if(rt < 0.55 || rt > 1.8) bad.push({ k:k, cur:c.daily_normal, ref:c._origNormal, rt:rt });
  });

    h += '<div style="background:#ffebee;border-left:4px solid #c62828;padding:12px 14px;border-radius:6px;margin-top:10px;line-height:1.85">'

      + bad.slice(0,6).map(function(x){ return esc(x.k) + '（现 ' + imInt(x.cur) + ' / 原 ' + imInt(x.ref) + '）'; }).join('；')
      + (bad.length > 6 ? ' 等' : '') + '。<br>'
      + '原因通常是历史导入把<b>同名但不同线网</b>的数据（如 BRT 文灶）写进了地铁站，或旧版本未聚合分时数据。'
      + '<br><button class="btn" style="margin-top:8px" onclick="imFixSuspects()">一键还原这些站的基准（数据仍保留为存档）</button></div>';
  }

  if(keys.length){
    h += '<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">查看已学到的站点基准（' + keys.length + ' 个）</summary>'
      + '<table style="margin-top:10px"><thead><tr><th>站名</th><th>归属</th><th style="text-align:right">常态日基准</th><th style="text-align:right">样本天数</th><th>数据区间</th></tr></thead><tbody>'
      + keys.map(function(k){
        var r = stt[k];
        var tag = r.ext ? '<span class="badge" style="background:#eceff1;color:#546e7a">仅存档</span>'
                : (r.suspect ? '<span class="badge" style="background:#fff3e0;color:#e65100">待确认</span>'
                             : '<span class="badge green">线网内</span>');
        return '<tr><td>' + esc(k) + '</td><td>' + tag + '</td><td style="text-align:right"><b>' + imInt(r.daily) + '</b></td><td style="text-align:right">' + imInt(r.days) + '</td>'
          + '<td style="font-size:12px;color:#999">' + esc((r.firstAt || '—') + ' ~ ' + (r.lastAt || '—')) + '</td></tr>';
      }).join('') + '</tbody></table></details>';
  }
  if(hist.length){
    h += '<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">学习履历（' + hist.length + ' 次）</summary>'
      + '<table style="margin-top:10px"><thead><tr><th>#</th><th>时间</th><th>来源</th><th style="text-align:right">记录数</th><th style="text-align:right">新增</th>'

/* ---- 文件读取 ---- */
function imReadFile(file){
  var rd = new FileReader();
  rd.onload = function(e){
    var txt = null;
    try{
      if(typeof XLSX !== 'undefined' && XLSX.read){
        var wb = XLSX.read(new Uint8Array(e.target.result), { type:'array', cellDates:true });
        var ws = wb.Sheets[wb.SheetNames[0]];
        imParseRows(XLSX.utils.sheet_to_json(ws, { header:1, raw:false, defval:'' }), file.name);
        return;
      }
    }catch(err){ /* 落到纯文本解析 */ }
    try{
      txt = new TextDecoder('utf-8').decode(new Uint8Array(e.target.result));
    }catch(err2){
      txt = e.target.result;
    }
    imParseRows(imParseCsv(txt), file.name);
  };
  rd.readAsArrayBuffer(file);
}
function imParseCsv(txt){
  var lines = String(txt).replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  var out = [];
  lines.forEach(function(ln){
    if(!ln.replace(/,/g,'').trim()) return;
    out.push(ln.split(',').map(function(c){ return String(c).replace(/^"|"$/g,'').trim(); }));
  });
  return out;
}

/* ---- 示例数据：用当前模型生成带噪声的实测值，便于快速体验整条链路 ---- */
function imLoadSample(){
  var dates = Object.keys(holidayMap || {}).filter(function(d){ return weatherMap && weatherMap[d]; }).sort();
  if(dates.length < 8) dates = ['2026-09-16','2026-09-17','2026-09-18','2026-09-19','2026-09-20','2026-09-21','2026-09-22','2026-09-23'];
  dates = dates.slice(0, 10);
  var picks = ['镇海路','厦门火车站','乌石浦','岭兜','湖里创新园','集美软件园','吕厝','中山公园','殿前','火炬园']
    .filter(function(n){ return allStations.indexOf(n) >= 0; });
  if(!picks.length) picks = allStations.slice(0, 10);
  var rows = [['站名','日期','进站量']];
  picks.forEach(function(n, i){
    dates.forEach(function(d, j){
      var base;
      try{ base = predictStation(n, d).totalPred; }catch(e){ base = 8000; }
      // 站级系统性偏差（模型基准与实测的真实差距，可被学习修正）+ 日间小幅随机波动（不可学）
      var bias = 0.86 + (i % 7) * 0.04;                 // 0.86 ~ 1.10
      var wobble = 1 + ((j % 3) - 1) * 0.012;           // ±1.2%
      rows.push([n, d, Math.round(base * bias * wobble)]);
    });
  });
  imParseRows(rows, '示例数据（系统生成）.csv');
}
